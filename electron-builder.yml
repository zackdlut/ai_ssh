appId: com.aiterminal.app
productName: AI Terminal
directories:
  output: release
  buildResources: build
npmRebuild: false
# Renderer deps are bundled into out/ by electron-vite; only ship main-process runtime deps.
files:
  - '!**/*'
  - out/**/*
  - package.json
  - node_modules/**/*
  # Shipped inside the app so BrowserWindow resolves the same relative path in
  # dev and when packaged.
  - build/icon.png
electronLanguages:
  - en-US
  - zh-CN
asarUnpack:
  - "**/node_modules/ssh2/**"
  - "**/node_modules/cpu-features/**"
linux:
  icon: build/icon.png
  target:
    - target: zip
      arch:
        - x64
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  category: Utility
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - target: zip
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
