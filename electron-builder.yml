appId: com.aiterminal.app
productName: AI Terminal
directories:
  output: release
  buildResources: build
npmRebuild: false
# `npm run build` writes platform-agnostic out/. `build:win` / `build:linux` pack it.
#
# Include only out/ + package.json + window icons. Production node_modules are
# collected separately. Every `!` pattern is also applied to that collector —
# never add `!**/*` or native deps will be dropped.
files:
  - out/**/*
  - package.json
  - build/icon.png
  - build/icon.ico
  - '!src/**'
  - '!docs/**'
  - '!scripts/**'
  - '!**/node_gyp_bins/**'
  - '!**/obj.target/**'
  - '!**/node_modules/openai/src/**'
  - '!**/node_modules/node-pty/{src,deps,third_party,scripts,typings}/**'
  - '!**/node_modules/cpu-features/{src,test,deps}/**'
  - '!**/node_modules/{sharp,@img,png-to-ico,pngjs}/**'
asarUnpack:
  - '**/*.{node,dll,exe}'
# Skills shipped with the app. They are copied into userData on install, so they
# only have to be readable at that moment — outside the asar keeps them
# inspectable and editable by anyone who wants to adapt one.
extraResources:
  - from: resources/skills
    to: skills
electronLanguages:
  - en-US
  - zh-CN
linux:
  icon: build/icon.png
  # A positive pattern is required: linux.files is merged as matcher[0], and an
  # excludes-only matcher would make electron-builder inject `**/*` (shipping src/).
  files:
    - package.json
    - '!**/node_modules/node-pty/prebuilds/**'
    # serialport ships N-API prebuilds for every platform it supports; a linux
    # x64 build loads only prebuilds/linux-x64. Keep both libc variants: which
    # one node-gyp-build picks is decided on the user's machine, not here.
    - '!**/node_modules/@serialport/bindings-cpp/prebuilds/{android-*,darwin-*,win32-*,linux-arm,linux-arm64}/**'
  target:
    - target: zip
      arch:
        - x64
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  category: Utility
# Wine is unavailable on this WSL host, so rcedit cannot run. Keep
# signAndEditExecutable false and stamp build/icon.ico in afterPack instead.
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  files:
    - package.json
    - '!**/node_modules/node-pty/prebuilds/darwin-*/**'
    - '!**/node_modules/node-pty/prebuilds/win32-arm64/**'
    - '!**/node_modules/node-pty/build/**'
    - '!**/node_modules/@serialport/bindings-cpp/prebuilds/{android-*,darwin-*,linux-*,win32-arm64,win32-ia32}/**'
  target:
    - target: zip
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
afterPack: ./scripts/win-set-icon.cjs
