name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      git_ref:
        description: '要构建的 git ref（分支 / tag / SHA）。留空则使用页面所选分支的最新提交。'
        required: false
        type: string
      tag:
        description: '要创建的 GitHub Release tag（如 v1.0.2）。留空则只构建并上传产物，不发版。'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: build:win
            artifact: release/*-win-*.zip
          - os: ubuntu-latest
            build: build:linux
            artifact: release/*-linux-*.zip
    runs-on: ${{ matrix.os }}
    steps:
      # Use the branch/tag name (not a pinned SHA) so a manual run always
      # checks out the tip of the selected ref when the job actually starts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The runner's bundled npm carries node-gyp 10, which cannot detect the
      # Visual Studio 2026 that windows-latest ships. npm 11 bundles node-gyp 12.
      - if: runner.os == 'Windows'
        run: npm install -g npm@11

      - run: npm ci
      - run: npm run ${{ matrix.build }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release/**
          generate_release_notes: true
