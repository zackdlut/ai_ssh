name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: build:win
            artifact: release/*-win-*.zip
          - os: ubuntu-latest
            build: build:linux
            artifact: release/*-linux-*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The runner's bundled npm carries node-gyp 10, which cannot detect the
      # Visual Studio 2026 that windows-latest ships. npm 11 bundles node-gyp 12.
      - if: runner.os == 'Windows'
        run: npm install -g npm@11

      - run: npm ci
      - run: npm run ${{ matrix.build }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/**
          generate_release_notes: true
